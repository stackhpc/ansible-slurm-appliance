---

# 1. Lint the code,  aborting the workflow if there are linting errors.
# 2. Determine which files have changed and set job outputs accordingly.
# 3. Conditionally run the stackhpc.yml workflow based on the changed files

name: Test on push and pull request

permissions: {}

'on':
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
      # To write Super-linter status checks
      statuses: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/lint.yml

  files_changed:
    name: Determine files changed to gate execution of stackhpc.yml workflow
    needs: lint
    runs-on: ubuntu-24.04
    # Map a step output to a job output, this allows other jobs to be gated on the filter results
    outputs:
      relevant_files_changed: ${{ steps.filter_relevant.outputs.changed }}
      relevant_excluded_files_changed: ${{ steps.filter_relevant_excluded.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

        # We want to trigger on all "relevant" files which doesn't include e.g. dev/* but should include "dev/setup-env.sh".
        # Unfortunately dorny/paths-filter doesn't have the same logic as 'on.paths' and 'on.paths-ignore'.
        # We have to use two filters:
        #  * first filter includes all changed files and removes "dev/" files
        #  * second filter explicitly adds 'dev/setup-env.sh'
        # Then the job is gated on the logical OR of the filters outputs.

      - name: Check for changes to relevant files
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter_relevant
        with:
          predicate-quantifier: 'every' # i.e. file only matches if it matches ALL rules
          list-files: 'json'
          filters: |
            changed:
              - '**'
              - '!dev/**'
              - '!**/*.md'
              - '!.gitignore'
              - '!.github/workflows/**'

      - name: Check for changes to otherwise- excluded files
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter_relevant_excluded
        with:
          predicate-quantifier: 'some' # i.e. file matches if ANY rule matches
          list-files: 'json'
          filters: |
            changed:
              - 'dev/setup-env.sh'
              - '.github/workflows/stackhpc.yml'
              - '.github/workflows/main.yml'

      - name: Show paths matching filters for debugging
        run: >
          echo '{ "relevant_files": '"${RELEVANT_FILES}"' }' | jq -r '.';
          echo '{ "relevant_excluded_files": '"${RELEVANT_EXCLUDED_FILES}"' }' | jq -r '.';
        env:
          RELEVANT_FILES: ${{ steps.filter_relevant.outputs.changed_files }}
          RELEVANT_EXCLUDED_FILES: ${{ steps.filter_relevant_excluded.outputs.changed_files }}

  stackhpc:
    name: Test deployment and reimage on OpenStack
    permissions:
      contents: read
    needs: files_changed
    if: |
      needs.files_changed.outputs.relevant_files_changed == 'true' ||
      needs.files_changed.outputs.relevant_excluded_files_changed == 'true'
    uses: ./.github/workflows/stackhpc.yml
    # uses most secrets, dynamically, so silence the warning
    secrets: inherit # zizmor: ignore[secrets-inherit]
