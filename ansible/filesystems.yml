---

- name: Setup custom mounts
  hosts: mounts
  become: true
  gather_facts: false # TODO?
  tags: mounts
  tasks:
    - ansible.builtin.include_role:
        name: mounts

- name: Setup block devices
  hosts: block_devices
  become: true
  gather_facts: false # TODO?
  tags: block_devices
  tasks:
    - ansible.builtin.include_role:
        name: block_devices

- name: Setup NFS
  hosts: nfs
  become: true
  gather_facts: false # TODO?
  tags:
    - nfs
  tasks:
    - ansible.builtin.include_role:
        name: stackhpc.nfs

- name: Setup Manila share mounts
  hosts: manila
  become: true
  gather_facts: false # TODO?
  tags: manila
  tasks:
    - ansible.builtin.include_role:
        name: stackhpc.os-manila-mount
        tasks_from: "{{ item }}"
      loop: "{{ ['lookup.yml', 'mount.yml'] if appliances_mode == 'configure' else ['main.yml'] }}"

- name: Setup Lustre clients
  hosts: lustre
  become: true
  gather_facts: false # TODO?
  tags: lustre
  tasks:
    - ansible.builtin.include_role:
        name: lustre
        # NB install is ONLY run in builder
        tasks_from: configure.yml

- name: Setup WEKA clients
  hosts: weka:!builder
  become: true
  gather_facts: false # TODO?
  tags:
    - weka
  tasks:
    - ansible.builtin.include_role:
        name: weka
        # install is done at runtime
        tasks_from: configure.yml
