---
- name: Generate persistent hostkeys in state directory
  vars:
    persist_hostkeys_mode: "shared" # or "individual"
    _persist_hostkeys_keyhost: "{{ ansible_hostname if persist_hostkeys_mode == 'individual' else groups['login'] | first }}"
  block:
    - name: Ensure hostkeys directory exists on persistent storage
      delegate_to: "{{ persist_hostkeys_state_server }}"
      ansible.builtin.file:
        path: "{{ persist_hostkeys_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0600"

    - name: Find hostkeys
      delegate_to: "{{ _persist_hostkeys_keyhost }}"
      ansible.builtin.find:
        path: /etc/ssh
        patterns:
          - ssh_host_*_key
          - ssh_host_*_key.pub
      register: _found_hostkeys

    - name: Create in-memory copies of keys
      delegate_to: "{{ _persist_hostkeys_keyhost }}"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ _found_hostkeys.files }}"
      register: _slurp_keys

    - name: Ensure hostkeys state directory per-host
      delegate_to: "{{ persist_hostkeys_state_server }}"
      ansible.builtin.file:
        path: "{{ persist_hostkeys_state_dir }}/{{ ansible_hostname }}/hostkeys"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Export hostkey
      delegate_to: "{{ persist_hostkeys_state_server }}"
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ persist_hostkeys_state_dir }}/{{ ansible_hostname }}/hostkeys/{{ item.source | basename }}"
        remote_src: true
        force: false # does not overwrite existing file
        owner: root
        group: root
        mode: "0440"
      loop: "{{ _slurp_keys.results }}"

    - name: Get created key names
      delegate_to: "{{ persist_hostkeys_state_server }}"
      ansible.builtin.find:
        path: "{{ persist_hostkeys_state_dir }}/"
      register: _find_ssh_keys

    - name: Create in-memory copies of keys
      delegate_to: "{{ persist_hostkeys_state_server }}"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ _find_ssh_keys.files }}"
      register: _slurp_keys

- name: Copy keys to hosts
  no_log: true
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "/etc/ssh/{{ item.source | regex_search('[^/]+$') }}"
    mode: "preserve"
  loop: "{{ _slurp_keys.results }}"

- ansible.builtin.meta: reset_connection
