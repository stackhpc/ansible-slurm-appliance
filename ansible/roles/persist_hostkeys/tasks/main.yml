---
- name: Collect hostkeys and prepare state directory
  vars:
    _persist_hostkeys_keyhost: "{{ (groups['login'] | first) if persist_hostkeys_mode == 'shared' else omit }}"
  block:
    - name: Ensure hostkeys directory exists on persistent storage
      delegate_to: "{{ persist_hostkeys_state_server }}"
      run_once: true
      ansible.builtin.file:
        path: "{{ persist_hostkeys_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Ensure hostkeys state directory per-host
      delegate_to: "{{ persist_hostkeys_state_server }}"
      ansible.builtin.file:
        path: "{{ persist_hostkeys_state_dir }}/{{ inventory_hostname }}/hostkeys"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Find hostkeys
      delegate_to: "{{ _persist_hostkeys_keyhost }}"
      ansible.builtin.find:
        path: /etc/ssh
        patterns:
          - ssh_host_*_key
          - ssh_host_*_key.pub
      register: _found_hostkeys

    - name: Create in-memory copies of keys
      delegate_to: "{{ _persist_hostkeys_keyhost }}"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ _found_hostkeys.files }}"
      register: _slurp_keys
      no_log: true

- name: Save hostkeys to state directory, if not existing
  delegate_to: "{{ persist_hostkeys_state_server }}"
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "{{ persist_hostkeys_state_dir }}/{{ inventory_hostname }}/hostkeys/{{ item.source | basename }}"
    remote_src: true
    force: false # does not overwrite existing file
    owner: root
    group: root
    mode: "0400"
  loop: "{{ _slurp_keys.results }}"
  no_log: true

- name: Find persisted keys
  delegate_to: "{{ persist_hostkeys_state_server }}"
  ansible.builtin.find:
    path: "{{ persist_hostkeys_state_dir }}/{{ inventory_hostname }}/hostkeys/"
  register: _find_ssh_keys

- name: Create in-memory copies of keys
  delegate_to: "{{ persist_hostkeys_state_server }}"
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ _find_ssh_keys.files }}"
  register: _slurp_persisted_keys
  no_log: true

- name: Copy keys to hosts
  no_log: true
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "/etc/ssh/{{ item.source | regex_search('[^/]+$') }}"
    mode: "preserve"
  loop: "{{ _slurp_persisted_keys.results }}"

- ansible.builtin.meta: reset_connection
