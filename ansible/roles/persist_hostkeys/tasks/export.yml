---
- name: Find hostkeys
  delegate_to: "{{ persist_hostkeys_state_server }}"
  register: _found_hostkeys
  ansible.builtin.find:
    path: "{{ persist_hostkeys_state_dir }}/"
    patterns:
      - ssh_host_*_key
      - ssh_host_*_key.pub

- name: Create in-memory copies of keys
  delegate_to: "{{ persist_hostkeys_state_server }}"
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ _found_hostkeys.files }}"
  register: _slurp_keys

- name: Ensure hostkeys export directory
  delegate_to: "{{ persist_hostkeys_state_server }}"
  ansible.builtin.file:
    path: /exports/cluster/hostconfig/{{ ansible_hostname }}/hostkeys
    state: directory
    owner: ansible-init
    group: ansible-init
    mode: "0750"

- name: Export hostkey
  delegate_to: "{{ persist_hostkeys_state_server }}"
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: /exports/cluster/hostconfig/{{ ansible_hostname }}/hostkeys/{{ item.source | basename }}
    remote_src: true
    owner: ansible-init
    group: ansible-init
    mode: "0440"
  loop: "{{ _slurp_keys.results }}"
