# Based on https://www.ibm.com/docs/en/storage-scale/5.1.8?topic=nodes-installing-spectrum-scale-packages-linux-systems
# Can't use ibm.spectrum_scale.core_prepare as it incorrectly delegates
# to localhost even when using scale_install_remotepkg_path

- name: Check spectrum scale version is set
  ansible.builtin.assert:
    that: scale_version is defined
    fail_msg: "ibm.spectrum_scale variable 'scale_version' MUST be set"

- name: Install s3cmd
  ansible.builtin.dnf:
    name: s3cmd

- name: Create s3 config
  ansible.builtin.copy:
    dest: ~/.s3cfg
    content: |
      {{ spectrum_scale_s3cfg }}
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: u=rw,go=

- name: Download installer to temporary directory
  ansible.builtin.command:
    cmd:  "s3cmd get --skip-existing {{ spectrum_scale_installer_s3path }} {{ scale_install_remotepkg_path }}"
    creates: "{{ spectrum_scale_installer_tmp }}"

- name: Write checkum file for ibm.spectrum_scale role
  ansible.builtin.copy:
    dest: "{{ scale_install_remotepkg_path }}.md5"
    content: "{{ spectrum_scale_installer_md5sum }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: ug=rw,o=

- include_role:
    name: ibm.spectrum_scale.core_install

- name: Remove s3 config
  ansible.builtin.file:
    path: ~/.s3cfg
    state: absent

- name: Remove installer
  ansible.builtin.file:
    path: "{{ scale_install_remotepkg_path }}"
    state: absent
