# Should be run on compute nodes you want to run RStudio on
# See https://osc.github.io/ood-documentation/latest/tutorials/tutorials-interactive-apps/add-rstudio.html
# - Will already have lmod

- name: Install R from EPEL
  ansible.builtin.dnf:
    name: R
    state: present

- name: Check if vulnerable Java version is present
  # RL8: java-1.8.0-openjdk-headless-1:1.8.0.504.b01-1.1.el8_10.x86_64
  # RL9 current vulnerable: java-17-openjdk-headless-1:17.0.21.0.9-2.2.el9_8.x86_64
  ansible.builtin.command: rpm -q java-17-openjdk-headless # noqa: command-instead-of-module
  register: _java17_rpm
  changed_when: false
  failed_when: false
  check_mode: false

- name: Mitigate CVE-2026-114938 (Java4Shell)
  when: _java17_rpm.rc == 0
  block:
    - name: Mitigate CVE-2026-114938 for R/rJava
      # Covers any use from R
      ansible.builtin.blockinfile:
        path: /usr/lib64/R/etc/Renviron.site
        create: true
        owner: root
        group: root
        mode: u=rw,go=r
        marker: "# {mark} CVE-2026-114938 mitigation"
        block: |
          # Remove once java-17-openjdk is patched.
          JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS} -XX:-UseBASE64Intrinsics

    - name: Mitigate CVE-2026-114938 for interactive shells
      ansible.builtin.copy:
        dest: /etc/profile.d/java4shell.sh
        content: |
          # Mitigation for CVE-2026-114938 (Java4Shell). Remove once java-17-openjdk is patched.
          case " ${JAVA_TOOL_OPTIONS} " in
            *" -XX:-UseBASE64Intrinsics "*) ;;
            *) export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:+${JAVA_TOOL_OPTIONS} }-XX:-UseBASE64Intrinsics" ;;
          esac
        owner: root
        group: root
        mode: u=rw,go=r

    - name: Find real Java 17 directory
      ansible.builtin.command: readlink -f /usr/lib/jvm/java-17-openjdk
      register: _java17_home
      changed_when: false

    - name: Move real java binary aside
      # needs to be in same directory due to RPATH etc issues
      ansible.builtin.command:
        cmd: mv bin/java bin/java.real
        chdir: "{{ _java17_home.stdout }}"
        creates: "{{ _java17_home.stdout }}/bin/java.real"

    - name: Install java wrapper (CVE-2026-114938 mitigation)
      ansible.builtin.copy:
        dest: "{{ _java17_home.stdout }}/bin/java"
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/sh
          # Mitigation for CVE-2026-114938 (Java4Shell). Remove once java-17-openjdk is patched.
          exec "{{ _java17_home.stdout }}/bin/java.real" -XX:-UseBASE64Intrinsics "$@"

- name: Install RStudio GPG key
  ansible.builtin.copy:
    content: "{{ openondemand_rstudio_gpg_key }}"
    dest: /etc/pki/rpm-gpg/RPM-GPG-KEY-RStudio
    owner: root
    group: root
    mode: '0644'

- name: Import RStudio GPG key
  ansible.builtin.rpm_key:
    key: /etc/pki/rpm-gpg/RPM-GPG-KEY-RStudio

- name: Download RStudio Server RPM
  ansible.builtin.get_url:
    url: "https://download2.rstudio.org/server/rhel{{ ansible_distribution_major_version }}/x86_64/rstudio-server-rhel-{{ openondemand_rstudio_version }}-x86_64.rpm" # noqa: yaml[line-length]
    dest: /tmp/rstudio-server.rpm
    mode: '0644'

- name: Install RStudio Server
  # checkov:skip=CKV2_ANSIBLE_4: "Ensure that packages with untrusted or missing GPG signatures are not used by dnf"
  ansible.builtin.dnf:
    name: /tmp/rstudio-server.rpm
    state: present

- name: Create module directory for RStudio Server
  ansible.builtin.file:
    path: /opt/ohpc/pub/modulefiles/rstudio-server
    state: directory
    mode: '0755'
    recurse: true

- name: Write modulefile for RStudio Server
  ansible.builtin.copy:
    dest: "/opt/ohpc/pub/modulefiles/rstudio-server/{{ openondemand_rstudio_version }}"
    mode: '0644'
    content: |
      #%Module1.0#####################################################################

      proc ModulesHelp { } {
          puts stderr " "
          puts stderr "This module loads RStudio Server {{ openondemand_rstudio_version }}"
          puts stderr "\nRStudio Server provides a browser-based interface to R.\n"
      }

      module-whatis "Name: rstudio-server"
      module-whatis "Version: {{ openondemand_rstudio_version }}"
      module-whatis "Category: IDE"
      module-whatis "Description: RStudio Server - IDE for R"
      module-whatis "URL: https://www.rstudio.com"

      set root /usr/lib/rstudio-server

      prepend-path PATH $root/bin
