---
- name: Enable baseos-debuginfo repo
  community.general.ini_file:
    path: "/etc/yum.repos.d/{{ _debuginfo_repofile }}"
    section: baseos-debuginfo
    option: enabled
    value: "1"
    mode: '0644'
    owner: root
    group: root
  vars:
    _debuginfo_repofile: "{{ 'rocky.repo' if ansible_distribution_version_major == '9' else 'Rocky-Debuginfo.repo' }}"

- name: Install systemtap and required kernel packages
  ansible.builtin.dnf:
    name:
      - systemtap
      - "kernel-debuginfo-{{ ansible_kernel }}"
      - "kernel-debuginfo-common-{{ ansible_architecture }}-{{ ansible_kernel }}"
      - "kernel-devel-{{ ansible_kernel }}"
    state: present
