- name: Cleanup dubious files with respect to security
  hosts: builder
  become: true
  gather_facts: true
  tags: sbom
  tasks:
    - name: Cleanup /tmp # noqa: no-changed-when
      ansible.builtin.shell: rm -rvf /tmp/*
    - name: Delete files triggering vulnerability scans
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: # NB: items here MUST have a justification!
        # ondemand install: raised at https://github.com/OSC/ondemand/security/advisories/GHSA-f7j8-ppqm-m5vw
        # All declared not to be an issue by Open Ondemand as relevant packages not installed
        - "/opt/ood/ondemand/root/usr/share/gems/3.3/ondemand/{{ ondemand_package_version }}-1/gems/bootstrap_form-2.7.0/test/dummy/Gemfile.lock"
        - "/opt/ood/ondemand/root/usr/share/gems/3.3/ondemand/{{ ondemand_package_version }}-1/gems/bootstrap_form-5.0.0/demo/yarn.lock"
        - /var/www/ood/apps/sys/dashboard/node_modules/data-confirm-modal/Gemfile.lock
        # chrony role: only used for role dev, venv never created on disk
        - /etc/ansible-init/playbooks/roles/mrlesmithjr.chrony/poetry.lock
        - /etc/ansible-init/playbooks/roles/mrlesmithjr.chrony/requirements.txt
        - /etc/ansible-init/playbooks/roles/mrlesmithjr.chrony/requirements-dev.txt
        # netbox collection: only used for role dev
        - /usr/lib/ansible-init/lib/python3.9/site-packages/ansible_collections/netbox/netbox/poetry.lock
        # esbuild in OOD
        - /var/www/ood/apps/sys/dashboard/node_modules/@esbuild/linux-x64/bin/esbuild
        - /usr/lib/rstudio-server/bin/quarto/bin/tools/x86_64/esbuild
    - name: Delete unwanted packages
      ansible.builtin.dnf:
        name: "{{ appliances_packages_uninstall }}"
        state: absent
    - name: Replace rclone with a no-op script if it exists
      block:
        - name: Check rclone existence
          ansible.builtin.stat:
            path: /usr/bin/rclone
            get_checksum: false
            get_mime: false
          register: rclone_present
        - name: Replace rclone with a no-op script
          when: rclone_present.stat.exists
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              echo "The rclone executable has been removed in ansible-slurm-appliance images due to too many security warnings." 1>&2
              exit 1
            dest: /usr/bin/rclone
            owner: root
            group: root
            mode: "0555"
    - name: Remove packages for or dependent on old kernels
      # needs to be before generate-sbom.yml
      ansible.builtin.command: dnf -y remove --oldinstallonly
      register: oldkern
      changed_when: "'No old installonly packages' not in oldkern.stderr"
      failed_when:
        - oldkern.rc != 0
        - "'No old installonly packages' not in oldkern.stderr"

- hosts: sbom
  become: true
  gather_facts: true
  tags: sbom
  tasks:
    - name: Ensure .grype.yaml is present
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.grype.yaml"
        dest: /tmp/.grype.yaml
        owner: "{{ ansible_user }}"
        mode: "0644"
    - name: Set sbom filename
      ansible.builtin.set_fact:
        sbom_filename: "{{ ansible_hostname }}.syft-json"
    - name: Install and run syft
      become: true
      changed_when: true
      ansible.builtin.shell: |
        cd /tmp
        set -eo pipefail
        curl -L -o syft_{{ appliances_generate_sbom_syft_version }}_linux_amd64.tar.gz  https://github.com/anchore/syft/releases/download/v{{ appliances_generate_sbom_syft_version }}/syft_{{ appliances_generate_sbom_syft_version }}_linux_amd64.tar.gz
        sha256sum -c <<<"{{ appliances_generate_sbom_syft_sha256 }}  syft_{{ appliances_generate_sbom_syft_version }}_linux_amd64.tar.gz"
        tar xf syft_{{ appliances_generate_sbom_syft_version }}_linux_amd64.tar.gz syft
        time ./syft scan \
          --exclude ./dev --exclude ./proc --exclude ./sys --exclude ./run \
          --config .grype.yaml \
          --source-name "$sbom" --source-version 1 \
          --output syft-json="$sbom" \
          dir:/
        ls -hl "$sbom"
        zip "${sbom}.zip" "$sbom"
        # no need to cleanup: cleanup.yml will wipe /tmp again.
      environment:
        sbom: "{{ sbom_filename }}"
    - name: Fetch the sbom to the control host
      ansible.builtin.fetch:
        src: "/tmp/{{ sbom_filename }}.zip"
        dest: "{{ playbook_dir }}/../sbom.zip"
        flat: true
