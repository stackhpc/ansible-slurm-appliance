# CVE-2026-90711: node.js proxy-addr vulnerable to IP spoofing via IPv4-mapped IPv6 trust subnet
# https://github.com/jshttp/proxy-addr/security/advisories/GHSA-jqcg-44mw-7w3h
  - vulnerability: GHSA-jqcg-44mw-7w3h
  # proxy-addr is reachable only via @jupyterlab/buildutils -> verdaccio -> express in an unused build-time lockfile.
