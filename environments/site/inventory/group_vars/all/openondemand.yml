openondemand_auth: basic_pam
openondemand_jupyter_partition: interactive
openondemand_desktop_partition: vgpu
openondemand_filesapp_paths:
  - /projects
  - /datasets
  - /scratch

user_map_cmd: /usr/local/bin/ondemand-usermap # see post-bootstrap hook

# Override default cluster configuration to set script wrappers to make AgR modules available
openondemand_cluster:
  v2:
    metadata:
      title: "{{ openhpc_cluster_name }}" # interpolation here works as openondemand is lexically after openhpc
    login:
      host: "{{ openondemand_login_host }}"
      default: true
    job:
      adapter: slurm
    batch_connect:
      basic:
        script_wrapper: |
          . /opt/ohpc/admin/lmod/lmod/init/bash
          export MODULEPATH=/mnt/gpfs/persist/apps/eri_rocky8/modules/all
          module purge
          %s
        set_host: host=$(hostname -s)
      vnc:
        script_wrapper: |
          . /opt/ohpc/admin/lmod/lmod/init/bash
          export MODULEPATH=/mnt/gpfs/persist/apps/eri_rocky8/modules/all
          module purge

          export PATH=/opt/TurboVNC/bin:$PATH
          # avoid "Failed to create secure directory (/run/user/*/pulse)"
          export XDG_RUNTIME_DIR="$TMPDIR/xdg_runtime"

          # Workaround to avoid "Unable to contact settings server" when
          # launching xfce4-session
          xfce4-session() { /bin/dbus-launch /bin/xfce4-session $@ ; }
          export -f xfce4-session
          %s
        set_host: host=$(hostname -s)
    custom: "{{ openondemand_cluster_grafana if groups['grafana'] | length > 0 else {} }}"

ood_install_apps:
  jupyter:  # repo currently named "eRI Jupyter"
    repo: "https://ignored:{{ vault_jupyter_ood_apps_glpat }}@gitlab.com/nesi1/ood-apps/bc_example_jupyter.git"
    version: staging
  igv: # repo currently named "IGV"
    repo: "https://ignored:{{ vault_igv_ood_apps_glpat }}@gitlab.com/nesi1/ood-apps/igv.git"
    version: staging-oct-2026 # TODO: update when merged:

# https://github.com/OSC/ondemand/tree/master/apps/bc_desktop
# also https://osc.github.io/ood-documentation/latest/enable-desktops/custom-job-submission.html#enable-desktops-custom-job-submission
openondemand_apps_desktop_agr:
  title: Remote Desktop
  description: Request a desktop to run GUI applications.
  cluster: "{{ openhpc_cluster_name }}"
  form:
    - desktop
    - auto_queues
    - bc_num_hours
    - num_cores
    - gres
    - gres_count
    - node
  attributes:
    desktop: xfce
    # bc_account: # i.e. slurm account
    #   value: root
    auto_queues:
      value: "{{ openondemand_desktop_partition | default(none) }}"
    num_cores:
      label: Number of cores
      value: 1
    gres:
      label: Resources
      help: Select GPU or other Slurm GRES resources
      required: true
      widget: select
      options: "{{ openondemand_gres_options }}"
    gres_count:
      label: Resource count
      help: Count of GPU or other Slurm GRES resources
      required: false
      widget: number_field
      value: 1
      min: 1
      step: 1
    node:
      label: Node name
      help: Select a particular node or leave empty to let Slurm pick the next available
      value: ""
  submit: |
    ---
    script:
      job_name: "ood-desktop"
      native:
        - "--partition"
        - "<%= auto_queues %>"
        - <%= "--nodes=1" %>
        - <%= "--ntasks=#{num_cores}" %>
        <% if node != '' %>
        - <%= "--nodelist=#{node}" %>
        <% end %>
        <% if gres != 'none' %>
        - <%= "--gres=#{gres}:#{gres_count}" %>
        <% end %>
        - <%= "--export=ALL" %>

openondemand_apps_jupyter_agr:
  title: Jupyter Lab
  description: Request a Jupyter Lab server
  cluster: "{{ openhpc_cluster_name }}"
  form:
    - modules
    - extra_jupyter_args
    - auto_queues
    - bc_num_hours
    - num_cores
    - num_mem
    - gres
    - gres_count
    - node
  attributes:
    num_cores:
      label: Number of cores
      value: 1
      widget: number_field
    modules: ""
    gres:
      label: Resources
      help: Select GPU or other Slurm GRES resources
      required: true
      widget: select
      options: "{{ openondemand_gres_options }}"
    gres_count:
      label: Resource count
      help: Count of GPU or other Slurm GRES resources
      required: false
      widget: number_field
      value: 1
      min: 1
      step: 1
    node:
      label: Node name
      help: Select a particular node or leave empty to let Slurm pick the next available
      value: ""
    num_mem:
      label: Memory per job (GB)
      widget: number_field
      value: 2
      min: 2
      max: 15
      step: 1
    extra_jupyter_args: ""
    auto_queues:
      value: "{{ openondemand_jupyter_partition | default(none) }}"
  submit: |
    ---
    batch_connect:
      template: "basic"
      script_wrapper: |
        module purge
        export PATH=/opt/jupyter-py312/bin/:$PATH
        %s
    script:
      job_name: "ood-jupyter"
      native:
        - "--partition"
        - "<%= auto_queues %>"
        - <%= "--nodes=1" %>
        - <%= "--ntasks=#{num_cores}" %>
        - <%= "--mem=#{num_mem}gb" %>
        <% if node != '' %>
        - <%= "--nodelist=#{node}" %>
        <% end %>
        <% if gres != 'none' %>
        - <%= "--gres=#{gres}:#{gres_count}" %>
        <% end %>

openondemand_dashboard_support_url: 'https://nznesi.atlassian.net/servicedesk/customer/portal/1/group/18'
openondemand_dashboard_docs_url: 'https://nznesi.atlassian.net/wiki/spaces/eRI/'

openondemand_apps_agr:
  files:
    env:
      ood_shell: ""
  shell:
    env:
      ood_shell_origin_check: "https://{{ openondemand_servername }}"
  dashboard:
    env:
      motd_path: /etc/motd
      motd_format: markdown
      ood_dashboard_support_url: "{{ openondemand_dashboard_support_url }}"
      ood_dashboard_docs_url: "{{ openondemand_dashboard_docs_url }}"
      ood_brand_bg_color: "#1b262b"
      ood_dashboard_title: "eRI OnDemand"


openondemand_apps_igv_module: "IGV/2.17.4"
openondemand_apps_igv_agr:
  title: IGV
  description: Request an IGV server
  cluster: "{{ openhpc_cluster_name }}"
  attributes:
    modules:
      widget: hidden_field
      value: "{{ openondemand_apps_igv_module  }}"
    bc_vnc_resolution:
      required: true
    bc_queue: "interactive"
    bc_num_hours:
      value: 1
      min: 1
      max: 8
      step: 1
    num_of_cores: 1
    num_mem:
      max: 14 # GB
  form:
    - modules
    - bc_queue
    - bc_num_hours
    - bc_vnc_resolution
    - num_of_cores
    - num_mem
  tile:
    title: "IGV"
    sub_caption: |
      Integrative Genomics Viewer
  submit: |
    ---
    batch_connect:
      template: "vnc"
    script:
      job_name: "ood-igv"
      native:
        - "--ntasks=1"
        - "--cpus-per-task=<%= num_of_cores %>"
        - "--mem=<%= num_mem %>G"
        - "--export=ALL"

openondemand_apps_interactive_agr:
  bc_desktop: "{{ openondemand_apps_desktop_agr }}"
  jupyter: "{{ openondemand_apps_jupyter_agr }}"
  igv: "{{ openondemand_apps_igv_agr }}"

ood_apps: "{{ openondemand_apps_agr | combine(openondemand_apps_interactive_agr) }}"

# Make the app presets (see environments/site/hooks/post.yml) appear as quick-launch tiles on the dashboard:
pinned_apps:
  - sys/igv/preset
  - sys/jupyter/preset
  - sys/bc_desktop/preset
