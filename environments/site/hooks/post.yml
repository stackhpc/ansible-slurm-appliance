- hosts: login:compute
  become: true
  gather_facts: false
  tags:  nesi
  # From roles/nesi, ran from ansible/nesi.yml when is_interactive: True OR False
  tasks:
    - name: libcrypto symlink
      ansible.builtin.file:
        src: /usr/lib64/libcrypto.so.1.0.2o
        dest: /usr/lib64/libcrypto.so.1.0.0
        owner: root
        group: root
        state: link
    - name: MOTD
      template:
        src: "motd"
        dest: "/etc/motd"


- hosts: login:interactive
  become: true
  gather_facts: false
  tags: nesi
  # From roles/nesi, ran from ansible/nesi.yml when is_interactive: True
  tasks:
    - name: User profile script
      template:
        src: "nesi.sh.j2"
        dest: /etc/profile.d/nesi.sh
    - name: nn_storage_quota
      copy:
        src: "nn_storage_quota"
        dest: "/usr/local/bin/nn_storage_quota"
        mode: "0755"
    - name: nn_storage_quota init
      ansible.builtin.command: "/usr/local/bin/nn_storage_quota -r"
      when: "'spectrum_scale' in group_names"


# From roles/nesi, ran from ansible/nesi.yml:
- hosts: openondemand
  become: true
  gather_facts: false
  name: Configure OnDemand
  tags:
    - openondemand
    - openondemand_server
  tasks:    
    - name: Ensure destination directory exists
      file:
        path: "{{ item }}"
        state: directory
      with_items: 
        - /etc/ood/config/apps/igv
        - /etc/ood/config/apps/jupyter
        - /etc/ood/config/apps/bc_desktop
        - /etc/ood/config/apps/dashboard/views/layouts
    - name: Embed Status and Override OpenOndemand html
      template:
        src: "application.html.erb"
        dest: "/etc/ood/config/apps/dashboard/views/layouts/application.html.erb"
        force: yes
    - name: Create quick launch IGV
      template:
        src: "igv_preset.yml"
        dest: "/etc/ood/config/apps/igv/preset.yml"
    - name: Create quick launch Jupyter Lab
      template:
        src: "jupyter_lab_preset.yml"
        dest: "/etc/ood/config/apps/jupyter/preset.yml"
    - name: Create quick launch Remote Desktop
      template:
        src: "remote_desk_preset.yml"
        dest: "/etc/ood/config/apps/bc_desktop/preset.yml"


- hosts: compute:&spectrum_scale:!builder
  tags: openhpc
  become: yes
  tasks:
    - name: Create Slurm prolog
      copy:
        dest: /opt/slurm-tools/bin/prolog.sh
        content: |
          #!/bin/bash
          for FS in /mnt/gpfs/scratch /mnt/gpfs/persist ; do
            /bin/mountpoint -q "$FS" || exit 1
          done
        owner: root
        group: root
        mode: u=rwx,go=rx


- hosts: login:!builder
  tags:
    - ssh
  become: yes
  tasks:
    - ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: ^ClientAliveInterval
        line: ClientAliveInterval 60
        state: present
      notify: reload-ssh
    - ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: ^ClientAliveCountMax
        line: ClientAliveCountMax 3
        state: present
      notify: reload-ssh
  handlers:
    - name: reload-ssh
      ansible.builtin.service:
        name: sshd
        state: reloaded


- name: Disable KCM and ensure kerberos credentials cache not set to homedir
  hosts: freeipa_client:!builder
  become: yes
  gather_facts: no
  tags: kerberos
  tasks:
    - name: Ensure Kerberos cache location not set to homedir
      lineinfile:
        path: /etc/krb5.conf
        regexp: '^#?\s*default_ccache_name = DIR:/home/%{username}/\.krb5ccdir'
        state: absent
    
    - name: Disable KCM
      replace:
        dest: /etc/krb5.conf.d/kcm_default_ccache
        regexp: '^\s*default_ccache_name = '
        replace: '#    default_ccache_name = KCM:'

- name: Modify SSSD configuration on FreeIPA clients
  hosts: freeipa_client:!builder
  become: yes
  gather_facts: no
  tags: sssd
  tasks:
    - name: Remove _srv_ from ipa_server entry
      lineinfile:
        path: /etc/sssd/sssd.conf
        line: 'ipa_server = {{ freeipa_servers[0] }}'
        regexp: '^ipa_server ='
      register: sssd_conf

    - name: Restart sssd
      systemd:
        name: sssd
        state: restarted
      when: sssd_conf.changed


- name: Modify Kerberos config on nodes requiring login
  hosts: compute:login:eri_interactive:!builder # note login includes ondemand too
  become: yes
  gather_facts: no
  tags: kerberos
  tasks:
    - name: KDC proxy (no longer needed since compute nodes can talk to AD)
      # community.general.ini_file can't handle the weird multiline value format
      blockinfile:
        path: /etc/krb5.conf
        insertafter: '\[realms\]'
        state: absent
        block: |
          # comment added to get indentation correct
            AGRESEARCH.CO.NZ = {
                kdc = https://{{ freeipa_servers[0] }}/KdcProxy
                kpasswd_server = https://{{ freeipa_servers[0] }}/KdcProxy
            }

            agresearch.co.nz = {
                kdc = https://{{ freeipa_servers[0] }}/KdcProxy
                kpasswd_server = https://{{ freeipa_servers[0] }}/KdcProxy
            }
      register: krb_conf

    - name: Restart sssd
      systemd:
        name: sssd
        state: restarted
      when: krb_conf.changed

- name: Access to eri_support group regardless of running jobs
  hosts: compute:!builder
  tags:
    - ssh
  become: yes
  tasks:
    - ansible.builtin.lineinfile:
        path: /etc/security/access.conf
        insertbefore: '-:ALL:ALL'
        line: '+:eri_support:ALL'
        regexp: 'eri_support' 
        state: present
