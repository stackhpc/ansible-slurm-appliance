all:
    vars:
        openhpc_cluster_name: staging
        cluster_domain_suffix: eri.agresearch.co.nz
        cluster_home_volume: false
        cluster_compute_groups: ["baremetal","gpu","hugemem","interactive","vgpu"]
        cluster_subnets:
            - "cidr": "10.1.112.0/24"
              "name": "nesi-hpc-baremetal-vlan112"
            

control:
    hosts:
        control:
            ansible_host: 10.1.112.100
            instance_id: 9d43cc28-4a2a-4194-95aa-575c84c41b25
            networks: {"nesi-hpc-baremetal-vlan112":{"fixed_ip_v4":"10.1.112.100","fixed_ip_v6":""}}
            node_fqdn: control.staging.eri.agresearch.co.nz
    vars:
        appliances_state_dir: /var/lib/state # NB needs to be set on group not host otherwise it is ignored in packer build!

# --- login nodes ---
staging_login_shell:
    hosts:
        login-0:
            ansible_host: 10.1.112.120
            instance_id: 9b359180-f830-4a68-9c6d-e26c3fa46326
            image_id: c42693db-3969-42ab-9c5e-abf5ac882d63
            networks: {"agr-vlan107":{"fixed_ip_v4":"10.29.107.120","fixed_ip_v6":""},"nesi-hpc-baremetal-vlan112":{"fixed_ip_v4":"10.1.112.120","fixed_ip_v6":""}}
            node_fqdn: login-0.staging.eri.agresearch.co.nz
            node_fip: 
            volumes: {}

login_shell:
    children:
        staging_login_shell:

staging_openondemand:
    hosts:
        ondemand:
            ansible_host: 10.1.112.130
            instance_id: 2dc0abf9-bc2e-4050-bb1a-de2dbfe9b891
            image_id: c42693db-3969-42ab-9c5e-abf5ac882d63
            networks: {"agr-vlan107":{"fixed_ip_v4":"10.29.107.130","fixed_ip_v6":""},"nesi-hpc-baremetal-vlan112":{"fixed_ip_v4":"10.1.112.130","fixed_ip_v6":""}}
            node_fqdn: ondemand.staging.eri.agresearch.co.nz
            node_fip: 
            volumes: {}

openondemand:
    children:
        staging_openondemand:


login:
    children:
        staging_login_shell:
        staging_openondemand:

